<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MiRed</title>
<style>
:root{--bg:#eef4f6;--card:#fff;--tx:#18262c;--mu:#5d727b;--ac:#0e7c86;--ac2:#0a5f67;--bd:#d9e4e8;--rd:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
header h1{margin:0;font-size:1.35rem;letter-spacing:.3px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;margin-left:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:5px 0;background:#fff;color:var(--tx)}
textarea{resize:vertical;min-height:70px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--ac);cursor:pointer;padding:4px 0;font-weight:600}
.err{color:var(--rd);margin:6px 0;min-height:1.2em}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who{font-weight:700}.when{color:var(--mu);font-size:.85rem}
.media{width:100%;max-height:480px;object-fit:contain;background:#dfe9ec;border-radius:8px;margin-top:8px}
.acts{display:flex;gap:16px;margin-top:8px;border-top:1px solid var(--bd);padding-top:6px}
.acts button{background:none;border:0;color:var(--mu);cursor:pointer;padding:6px 0}
.acts button.on{color:var(--ac);font-weight:700}
.cm{background:#f3f8f9;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.95rem}
.cm b{margin-right:4px}
.del{color:var(--rd)!important}
.tabs{display:flex;gap:8px;margin:4px 0}.tabs button{flex:1;border:1px solid var(--bd);background:#fff;color:var(--mu);border-radius:8px;padding:9px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.muted{color:var(--mu);font-size:.9rem}.precio{color:var(--ac2);font-weight:700;font-size:1.15rem}
.fotos{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.fotos img{height:200px;border-radius:8px;flex:none;max-width:100%;object-fit:cover}
label{display:block;margin:6px 0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;min-height:100dvh}
img,video{max-width:100%}
.card{overflow-wrap:anywhere}
.wrap{max-width:640px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
header{padding-top:env(safe-area-inset-top)}
.btn,.tabs button,.acts button,.link{min-height:44px}
.media{max-height:min(70vh,520px)}
.fotos img{height:clamp(150px,45vw,240px)}
.tabs button i{font-style:normal;display:block;font-size:1.2rem;line-height:1.1}
@media (min-width:900px){body{font-size:17px}.wrap{max-width:700px}}
@media (max-width:700px){
 body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0;gap:4px;background:#fff;border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
 .tabs button{border:0;background:none;font-size:.8rem;padding:4px 2px}
 .tabs button.on{background:none;color:var(--ac)}
 .card{padding:12px;border-radius:10px}
}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const NAME = 'MiRed';
const SB_URL = 'https://ozuhlntqjbdjawquffsu.supabase.co';
const SB_KEY = 'sb_publishable_P7drPzVRwncGeBq6EtJb0Q_Wk7OmGaq';
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const esc = t => (t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha = d => new Date(d).toLocaleString('es-AR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
let me = null, signup = false;
document.title = NAME;

function vistaAcceso() {
  app.innerHTML = `<header><div class="wrap"><h1>${esc(NAME)}</h1></div></header>
  <div class="wrap"><form class="card" id="f">
    <h2 style="margin-top:0">${signup ? 'Crear cuenta' : 'Entrar'}</h2>
    ${signup ? '<input id="u" placeholder="Tu nombre" required maxlength="30">' : ''}
    <input id="e" type="email" placeholder="Correo electrónico" required>
    <input id="p" type="password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6">
    <label class="muted"><input type="checkbox" id="sp" style="width:auto"> Mostrar contraseña</label>
    <div class="err" id="m"></div>
    <button class="btn" type="submit">${signup ? 'Crear cuenta' : 'Entrar'}</button>
    <div><button type="button" class="link" id="sw">${signup ? 'Ya tengo cuenta' : 'No tengo cuenta, quiero crear una'}</button></div>
    ${signup ? '' : '<div><button type="button" class="link" id="fg">Olvidé mi contraseña</button></div>'}
  </form></div>`;
  document.getElementById('sw').onclick = () => { signup = !signup; vistaAcceso(); };
  document.getElementById('sp').onchange = ev => { document.getElementById('p').type = ev.target.checked ? 'text' : 'password'; };
  const fg = document.getElementById('fg');
  if (fg) fg.onclick = async () => {
    const m = document.getElementById('m'), email = document.getElementById('e').value.trim();
    m.style.color = ''; m.textContent = '';
    if (!email) { m.textContent = 'Escribí tu correo arriba y volvé a tocar "Olvidé mi contraseña".'; return; }
    const r = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    if (r.error) { m.textContent = 'No se pudo enviar: ' + r.error.message; return; }
    m.style.color = '#0a5f67'; m.textContent = 'Listo. Revisá tu correo (y la carpeta de spam) y tocá el enlace para elegir una contraseña nueva.';
  };
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const m = document.getElementById('m'); m.textContent = '';
    const email = document.getElementById('e').value.trim(), password = document.getElementById('p').value;
    const r = signup
      ? await sb.auth.signUp({email, password, options:{data:{username:document.getElementById('u').value.trim()}}})
      : await sb.auth.signInWithPassword({email, password});
    if (r.error) { m.textContent = 'No se pudo: ' + r.error.message; return; }
    if (!r.data.session) { m.style.color = '#0a5f67'; m.textContent = 'Cuenta creada. Revisá tu correo para confirmarla y después entrá.'; return; }
    iniciar();
  };
}

async function iniciar() {
  const {data} = await sb.auth.getSession();
  if (recuperando) return vistaNuevaClave();
  if (!data.session) return vistaAcceso();
  me = data.session.user;
  app.innerHTML = `<header><div class="wrap"><h1>${esc(NAME)}</h1><div>
    <button id="rf">Actualizar</button><button id="out">Salir</button></div></div></header>
  <div class="wrap"><div class="tabs" id="tabs"></div><div id="muro">
    <div class="card"><textarea id="t" placeholder="¿Qué querés compartir?" maxlength="1000"></textarea>
      <input id="fl" type="file" accept="image/*,video/*">
      <div class="err" id="pm"></div>
      <button class="btn" id="pub">Publicar</button></div>
    <div id="feed"><p style="text-align:center;color:var(--mu)">Cargando…</p></div></div><div id="ventas" hidden></div></div>`;
  document.getElementById('out').onclick = async () => { await sb.auth.signOut(); me = null; vistaAcceso(); };
  document.getElementById('rf').onclick = cargar;
  document.getElementById('pub').onclick = publicar;
  document.getElementById('feed').onclick = acciones;
  cargar(); initVentas();
}

async function publicar() {
  const b = document.getElementById('pub'), pm = document.getElementById('pm');
  const body = document.getElementById('t').value.trim(), file = document.getElementById('fl').files[0];
  pm.textContent = '';
  if (!body && !file) { pm.textContent = 'Escribí algo o elegí una foto o video.'; return; }
  b.disabled = true; b.textContent = 'Publicando…';
  let media_url = null, media_type = null;
  if (file) {
    const path = `${me.id}/${Date.now()}_${file.name.replace(/[^\w.]/g, '_')}`;
    const up = await sb.storage.from('media').upload(path, file);
    if (up.error) { pm.textContent = 'No se pudo subir el archivo: ' + up.error.message; b.disabled = false; b.textContent = 'Publicar'; return; }
    media_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
    media_type = file.type.startsWith('video') ? 'video' : 'image';
  }
  const r = await sb.from('posts').insert({body, media_url, media_type});
  b.disabled = false; b.textContent = 'Publicar';
  if (r.error) { pm.textContent = 'No se pudo publicar: ' + r.error.message; return; }
  document.getElementById('t').value = ''; document.getElementById('fl').value = '';
  cargar();
}

async function cargar() {
  const feed = document.getElementById('feed');
  const {data, error} = await sb.from('posts')
    .select('*, profiles!user_id(username), likes(user_id), comments(id, body, created_at, profiles!user_id(username))')
    .order('created_at', {ascending:false}).limit(50);
  if (error) { feed.innerHTML = `<p class="err">No se pudo cargar: ${esc(error.message)}</p>`; return; }
  if (!data.length) { feed.innerHTML = '<p style="text-align:center;color:var(--mu)">Todavía no hay publicaciones. ¡Hacé la primera!</p>'; return; }
  feed.innerHTML = data.map(p => {
    const liked = p.likes.some(l => l.user_id === me.id);
    const cms = p.comments.sort((a, b) => a.created_at.localeCompare(b.created_at))
      .map(c => `<div class="cm"><b>${esc(c.profiles?.username)}</b>${esc(c.body)}</div>`).join('');
    const media = p.media_url ? (p.media_type === 'video'
      ? `<video class="media" src="${esc(p.media_url)}" controls playsinline preload="metadata"></video>`
      : `<img class="media" src="${esc(p.media_url)}" alt="Foto publicada" loading="lazy">`) : '';
    return `<div class="card" data-id="${p.id}">
      <div class="row"><span class="who">${esc(p.profiles?.username)}</span><span class="when">${fecha(p.created_at)}</span></div>
      <p style="white-space:pre-wrap;margin:8px 0 0">${esc(p.body)}</p>${media}
      <div class="acts">
        <button data-a="like" class="${liked ? 'on' : ''}">${liked ? '♥' : '♡'} Me gusta (${p.likes.length})</button>
        <button data-a="cm">Comentarios (${p.comments.length})</button>
        ${p.user_id === me.id ? '<button data-a="del" class="del">Borrar</button>' : ''}
      </div>
      <div class="cms" hidden>${cms}
        <div class="row" style="flex-wrap:nowrap"><input placeholder="Escribí un comentario" maxlength="300"><button class="btn" data-a="send">Enviar</button></div>
      </div></div>`;
  }).join('');
}

async function acciones(ev) {
  const btn = ev.target.closest('button[data-a]'); if (!btn) return;
  const card = btn.closest('.card'), id = Number(card.dataset.id), a = btn.dataset.a;
  if (a === 'cm') { const c = card.querySelector('.cms'); c.hidden = !c.hidden; return; }
  if (a === 'like') {
    if (btn.classList.contains('on')) await sb.from('likes').delete().eq('post_id', id).eq('user_id', me.id);
    else await sb.from('likes').insert({post_id: id});
  }
  if (a === 'del') { if (!confirm('¿Borrar esta publicación?')) return; await sb.from('posts').delete().eq('id', id); }
  if (a === 'send') {
    const inp = card.querySelector('.cms input'), body = inp.value.trim(); if (!body) return;
    await sb.from('comments').insert({post_id: id, body});
    await cargar();
    document.querySelector(`[data-id="${id}"] .cms`).hidden = false; return;
  }
  cargar();
}

/* ===== VENTAS ===== */
const CATS = ['Vehículos','Hogar','Herramientas','Electrónica','Ropa','Servicios','Otros'];
const OPTS = CATS.map(c => `<option>${c}</option>`).join('');
let esAdmin = false, vlist = [];
const g = id => document.getElementById(id);

async function initVentas() {
  esAdmin = (await sb.rpc('es_admin')).data === true;
  const tabs = g('tabs');
  tabs.innerHTML = `<button data-t="muro" class="on"><i>🏠</i>Muro</button><button data-t="ventas"><i>🛒</i>Ventas</button>${esAdmin ? '<button data-t="admin"><i>🚩</i>Reportes</button>' : ''}`;
  tabs.onclick = e => {
    const bt = e.target.closest('button[data-t]'); if (!bt) return; const t = bt.dataset.t;
    [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.t === t));
    g('muro').hidden = t !== 'muro'; g('ventas').hidden = t === 'muro';
    if (t === 'ventas') vistaVentas();
    if (t === 'admin') vistaAdmin();
  };
}

function vistaVentas() {
  g('ventas').innerHTML = `
  <div class="card"><button class="btn" id="nv">+ Publicar un aviso</button>
    <form id="vf" hidden>
      <input id="vt" placeholder="¿Qué vendés?" required maxlength="80">
      <textarea id="vd" placeholder="Descripción" maxlength="800"></textarea>
      <input id="vp" type="number" min="0" placeholder="Precio en pesos" required>
      <select id="vc">${OPTS}</select>
      <input id="vw" placeholder="Tu WhatsApp con código de área, sin 0 ni 15 (ej: 3492123456)" required>
      <label class="muted">Fotos (hasta 4)</label><input id="vi" type="file" accept="image/*" multiple>
      <label><input id="va" type="checkbox" style="width:auto"> Publicar como anónimo (tu nombre no se muestra)</label>
      <div class="err" id="ve"></div>
      <button class="btn" type="submit">Publicar aviso</button>
    </form></div>
  <div class="card"><input id="q" type="search" placeholder="Buscar productos…">
    <div class="row"><select id="fc"><option value="">Todas las categorías</option>${OPTS}</select>
    <select id="fo"><option value="n">Más nuevos</option><option value="a">Precio: menor a mayor</option><option value="d">Precio: mayor a menor</option></select></div></div>
  <div id="vl"><p class="muted">Cargando…</p></div>`;
  g('nv').onclick = () => { g('vf').hidden = !g('vf').hidden; };
  ['q', 'fc', 'fo'].forEach(i => g(i).oninput = pintarVentas);
  g('vf').onsubmit = publicarVenta;
  g('vl').onclick = accionesVenta;
  cargarVentas();
}

async function publicarVenta(ev) {
  ev.preventDefault();
  const e = g('ve'), b = ev.target.querySelector('button[type=submit]');
  e.textContent = ''; b.disabled = true; b.textContent = 'Publicando…';
  const fin = msg => { if (msg) e.textContent = msg; b.disabled = false; b.textContent = 'Publicar aviso'; };
  let tel = g('vw').value.replace(/\D/g, '').replace(/^0+/, ''); if (!tel.startsWith('54')) tel = '549' + tel;
  const fotos = [];
  for (const f of [...g('vi').files].slice(0, 4)) {
    const path = `${me.id}/${Date.now()}_${f.name.replace(/[^\w.]/g, '_')}`;
    const up = await sb.storage.from('media').upload(path, f);
    if (up.error) return fin('No se pudo subir una foto: ' + up.error.message);
    fotos.push(sb.storage.from('media').getPublicUrl(path).data.publicUrl);
  }
  const r = await sb.from('listings').insert({titulo: g('vt').value.trim(), descripcion: g('vd').value.trim(),
    precio: Number(g('vp').value), categoria: g('vc').value, telefono: tel, fotos, anonimo: g('va').checked});
  if (r.error) return fin('No se pudo publicar: ' + r.error.message);
  fin(); ev.target.reset(); ev.target.hidden = true; cargarVentas();
}

async function cargarVentas() {
  const {data, error} = await sb.from('ventas_v').select('*').eq('vendido', false)
    .order('created_at', {ascending: false}).limit(300);
  if (error) { g('vl').innerHTML = `<p class="err">No se pudo cargar: ${esc(error.message)}</p>`; return; }
  vlist = data; pintarVentas();
}

function pintarVentas() {
  const q = g('q').value.toLowerCase(), c = g('fc').value, o = g('fo').value;
  const l = vlist.filter(x => (!c || x.categoria === c) && (!q || (x.titulo + ' ' + (x.descripcion || '')).toLowerCase().includes(q)));
  if (o === 'a') l.sort((a, b) => a.precio - b.precio);
  if (o === 'd') l.sort((a, b) => b.precio - a.precio);
  if (!l.length) { g('vl').innerHTML = '<p class="muted" style="text-align:center">No hay avisos con esa búsqueda.</p>'; return; }
  g('vl').innerHTML = l.map(x => {
    const mio = x.user_id === me.id;
    const autor = x.anonimo ? 'Anónimo' + (x.autor ? ` (${esc(x.autor)})` : '') : esc(x.autor);
    const msg = encodeURIComponent(`Hola, vi tu aviso "${x.titulo}" en ${NAME}. ¿Sigue disponible?`);
    return `<div class="card" data-id="${x.id}">
      ${x.fotos?.length ? `<div class="fotos">${x.fotos.map(u => `<img src="${esc(u)}" alt="Foto del producto" loading="lazy">`).join('')}</div>` : ''}
      <div class="row"><b>${esc(x.titulo)}</b><span class="precio">$ ${Number(x.precio).toLocaleString('es-AR')}</span></div>
      <div class="when">${esc(x.categoria)} · ${autor} · ${fecha(x.created_at)}</div>
      <p style="white-space:pre-wrap;margin:6px 0">${esc(x.descripcion)}</p>
      <div class="row"><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${esc(x.telefono)}?text=${msg}">Contactar por WhatsApp</a>
      <span>${mio ? '<button class="link" data-a="sold">Marcar vendido</button>' : '<button class="link" data-a="rep">Reportar</button>'}
      ${mio || esAdmin ? '<button class="link del" data-a="del">Borrar</button>' : ''}</span></div></div>`;
  }).join('');
}

async function accionesVenta(ev) {
  const btn = ev.target.closest('button[data-a]'); if (!btn) return;
  const id = Number(btn.closest('.card').dataset.id), a = btn.dataset.a;
  if (a === 'sold') await sb.from('listings').update({vendido: true}).eq('id', id);
  if (a === 'del') { if (!confirm('¿Borrar este aviso?')) return; await sb.from('listings').delete().eq('id', id); }
  if (a === 'rep') {
    const motivo = prompt('¿Por qué querés reportar este aviso?'); if (!motivo) return;
    const r = await sb.from('reports').insert({listing_id: id, motivo});
    alert(r.error ? 'Ya reportaste este aviso antes.' : 'Gracias, lo vamos a revisar.'); return;
  }
  cargarVentas();
}

async function vistaAdmin() {
  const v = g('ventas'); v.innerHTML = '<p class="muted">Cargando…</p>';
  const {data: reps} = await sb.from('reports').select('*').order('created_at', {ascending: false});
  if (!reps?.length) { v.innerHTML = '<p class="muted" style="text-align:center">No hay reportes pendientes.</p>'; return; }
  const ids = [...new Set(reps.map(r => r.listing_id))];
  const {data: avs} = await sb.from('ventas_v').select('*').in('id', ids);
  v.innerHTML = ids.map(id => {
    const x = (avs || []).find(a => a.id === id); if (!x) return '';
    const rs = reps.filter(r => r.listing_id === id);
    return `<div class="card" data-id="${id}"><b>${esc(x.titulo)}</b>
      <div class="when">Publicado por: ${esc(x.autor)}${x.anonimo ? ' (anónimo)' : ''} · ${rs.length} reporte(s)</div>
      ${rs.map(r => `<div class="cm">${esc(r.motivo)}</div>`).join('')}
      <button class="link del" data-a="adel">Borrar aviso</button>
      <button class="link" data-a="adis">Descartar reportes</button></div>`;
  }).join('');
  v.onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const id = Number(b.closest('.card').dataset.id);
    if (b.dataset.a === 'adel') { if (!confirm('¿Borrar el aviso?')) return; await sb.from('listings').delete().eq('id', id); }
    else await sb.from('reports').delete().eq('listing_id', id);
    vistaAdmin();
  };
}


let recuperando = location.hash.includes('type=recovery');
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { recuperando = true; vistaNuevaClave(); } });
function vistaNuevaClave() {
  app.innerHTML = `<header><div class="wrap"><h1>${esc(NAME)}</h1></div></header>
  <div class="wrap"><form class="card" id="nf"><h2 style="margin-top:0">Elegí tu contraseña nueva</h2>
    <input id="np" type="password" placeholder="Contraseña nueva (mínimo 6 caracteres)" required minlength="6">
    <div class="err" id="nm"></div><button class="btn" type="submit">Guardar contraseña</button></form></div>`;
  document.getElementById('nf').onsubmit = async ev => {
    ev.preventDefault();
    const r = await sb.auth.updateUser({password: document.getElementById('np').value});
    if (r.error) { document.getElementById('nm').textContent = 'No se pudo cambiar: ' + r.error.message; return; }
    recuperando = false; history.replaceState(null, '', location.pathname); iniciar();
  };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
iniciar();
</script>
</body>
</html>
